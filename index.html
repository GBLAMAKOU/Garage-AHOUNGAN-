<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garage AHOUNGAN</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><header class="bg-slate-900 text-white p-4"><div class="max-w-6xl mx-auto flex justify-between"><h1 class="font-black">🔧 Garage AHOUNGAN</h1><span class="bg-orange-500 px-3 py-1 rounded-full text-xs">5000F/mois</span></div></header><main class="max-w-6xl mx-auto p-4"><div class="grid grid-cols-3 gap-3 mb-6"><div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">Véhicules</p><p id="countVeh" class="text-2xl font-black">0</p></div><div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">En réparation</p><p id="countRep" class="text-2xl font-black text-orange-600">0</p></div><div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">Chiffre</p><p id="countCA" class="text-2xl font-black text-green-600">0 F</p></div></div><div class="flex gap-2 mb-4"><button onclick="showForm('client')" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm">+ Client</button><button onclick="showForm('vehicule')" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm">+ Voiture</button><button onclick="showForm('intervention')" class="bg-white border px-4 py-2 rounded-lg text-sm">Facturer</button></div><div id="formArea" class="hidden bg-white p-4 rounded-xl shadow mb-6"></div><div class="bg-white rounded-xl shadow"><div class="p-4 border-b flex justify-between"><h3 class="font-bold">Atelier</h3><input id="search" oninput="render()" placeholder="Rechercher..." class="border px-3 py-1 rounded-lg text-sm"></div><div id="list" class="divide-y"></div></div></main><script>let data=JSON.parse(localStorage.getItem('ahoungan')||'[]');function save(){localStorage.setItem('ahoungan',JSON.stringify(data));render();}function showForm(t){const a=formArea;a.classList.remove('hidden');if(t==='client'){a.innerHTML=`<h3 class=font-bold mb-3>Client</h3><input id=cNom placeholder=Nom class=border p-2 rounded w-full mb-2><input id=cTel placeholder=Téléphone class=border p-2 rounded w-full><button onclick=addClient() class="mt-3 bg-slate-900 text-white px-4 py-2 rounded">Enregistrer</button>`;}if(t==='vehicule'){a.innerHTML=`<h3 class=font-bold mb-3>Voiture</h3><input id=vClient placeholder=Nom client class=border p-2 rounded w-full mb-2><input id=vMat placeholder=Immatriculation class=border p-2 rounded w-full mb-2><input id=vMarque placeholder=Marque class=border p-2 rounded w-full mb-2><input id=vProb placeholder=Panne class=border p-2 rounded w-full><button onclick=addVeh() class="mt-3 bg-orange-500 text-white px-4 py-2 rounded">Entrer garage</button>`;}if(t==='intervention'){a.innerHTML=`<h3 class=font-bold mb-3>Facturer</h3><input id=iMat placeholder=Matricule class=border p-2 rounded w-full mb-2><input id=iPrix type=number placeholder=Montant class=border p-2 rounded w-full><button onclick=facturer() class="mt-3 bg-green-600 text-white px-4 py-2 rounded">Facturer</button>`;}}function addClient(){if(!cNom.value)return alert('Nom requis');data.push({type:'client',nom:cNom.value,tel:cTel.value});save();formArea.classList.add('hidden');}function addVeh(){if(!vMat.value)return alert('Matricule requis');data.push({type:'veh',client:vClient.value,mat:vMat.value.toUpperCase(),marque:vMarque.value,panne:vProb.value,statut:'en_cours',date:new Date().toLocaleDateString()});save();formArea.classList.add('hidden');}function facturer(){let m=iMat.value.toUpperCase(),p=parseInt(iPrix.value||0);let v=data.find(d=>d.type==='veh'&&d.mat===m&&d.statut==='en_cours');if(!v)return alert('Non trouvé');v.statut='livre';v.prix=p;data.push({type:'ca',montant:p});save();formArea.classList.add('hidden');alert('Facturé '+p+'F');}function render(){const q=(search.value||'').toLowerCase();const vehs=data.filter(d=>d.type==='veh').filter(v=>v.mat.toLowerCase().includes(q));countVeh.innerText=data.filter(d=>d.type==='veh').length;countRep.innerText=data.filter(d=>d.type==='veh'&&d.statut==='en_cours').length;let ca=data.filter(d=>d.type==='ca').reduce((s,c)=>s+c.montant,0);countCA.innerText=ca.toLocaleString()+' F';let h='';vehs.reverse().forEach(v=>{h+=`<div class=p-4 flex justify-between><div><p class=font-bold>${v.mat} - ${v.marque}</p><p class="text-xs text-slate-500">${v.client} | ${v.panne}</p></div><span class="text-xs px-2 py-1 rounded-full ${v.statut==='en_cours'?'bg-orange-100 text-orange-600':'bg-green-100 text-green-600'}">${v.statut}</span></div>`});list.innerHTML=h||'<p class=p-8 text-center text-slate-400>Aucun véhicule</p>';}render();</script></body></html>
